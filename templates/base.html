<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}TMS — Task Master{% endblock %}</title>
        <meta name="theme-color" content="#0a0f1e" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        />
    </head>
    <body>
        <div class="grain"></div>

        <!-- Navigation -->
        <nav class="nav" id="nav">
            <div class="nav-inner">
                <a class="brand" href="{{ url_for('pages.landing') }}">
                    <div class="brand-icon">
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                        >
                            <path d="M9 12l2 2 4-4" />
                            <circle cx="12" cy="12" r="10" />
                        </svg>
                    </div>
                    <span>Task<strong>Master</strong></span>
                </a>

                <div class="nav-links">
                    <a
                        href="{{ url_for('pages.homepage') }}"
                        class="nav-link {% if request.endpoint == 'pages.homepage' %}active{% endif %}"
                    >
                        Dashboard
                    </a>
                    <a
                        href="{{ url_for('pages.about') }}"
                        class="nav-link {% if request.endpoint == 'pages.about' %}active{% endif %}"
                    >
                        About
                    </a>
                    <a href="{{ url_for('pages.login') }}" class="nav-cta">
                        Sign In
                    </a>
                </div>

                <button
                    class="mobile-menu-btn"
                    id="mobileMenuBtn"
                    aria-label="Menu"
                >
                    <span></span><span></span><span></span>
                </button>
            </div>

            <div class="mobile-menu" id="mobileMenu">
                <a href="{{ url_for('pages.homepage') }}" class="mobile-link"
                    >Dashboard</a
                >
                <a href="{{ url_for('pages.about') }}" class="mobile-link"
                    >About</a
                >
                <a href="{{ url_for('pages.login') }}" class="mobile-link"
                    >Sign In</a
                >
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main">{% block content %}{% endblock %}</main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-inner">
                <span class="footer-brand">Task<strong>Master</strong></span>
                <span class="footer-copy">Built by Rashed Alothman · 2025</span>
                <div class="footer-links">
                    <a href="{{ url_for('pages.landing') }}">Home</a>
                    <a href="{{ url_for('pages.about') }}">About</a>
                </div>
            </div>
        </footer>

        <script>
            // Nav scroll effect
            const nav = document.getElementById("nav");
            window.addEventListener("scroll", () => {
                nav.classList.toggle("scrolled", window.scrollY > 20);
            });

            // Mobile menu
            const btn = document.getElementById("mobileMenuBtn");
            const menu = document.getElementById("mobileMenu");
            btn.addEventListener("click", () => {
                btn.classList.toggle("open");
                menu.classList.toggle("open");
            });
        </script>

        {% block scripts %}{% endblock %}
    </body>
</html>
